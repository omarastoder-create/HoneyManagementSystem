spring.application.name=HoneyManagementSystem
server.port=8080
spring.jpa.hibernate.ddl-auto=create-drop
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
spring.jpa.open-in-view=false
# Web frontend (ng serve), mobile app in the browser (ionic serve), and the native app:
# Android WebView = http://localhost, iOS WebView = capacitor://localhost
app.cors.allowed-origins=http://localhost:4200,http://localhost:8100,http://localhost,https://localhost,capacitor://localhost
# Folder for uploaded product images and expense receipts (relative to the working directory or absolute)
app.storage.root=uploads